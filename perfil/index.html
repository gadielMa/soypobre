<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Soy Pobre</title>
    <link rel="stylesheet" href="styles.css?v=6" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div id="accountArea" class="account-area" hidden>
      <button id="accountButton" class="account-button" type="button" aria-expanded="false" aria-controls="accountMenu">
        <span id="accountInitials"></span>
      </button>
      <div id="accountMenu" class="account-menu" hidden>
        <strong id="accountName"></strong>
        <button id="signOutButton" type="button">Cerrar sesión</button>
      </div>
    </div>
    <main>
      <section id="profile" class="profile" hidden>
        <p class="eyebrow">tu información</p>
        <h1>Estos son<br /><span>tus datos.</span></h1>
        <dl>
          <div><dt>Alias</dt><dd id="profileAlias"></dd></div>
          <div id="nameRow"><dt>Nombre</dt><dd id="profileName"></dd></div>
          <div id="storyRow"><dt>Historia</dt><dd id="profileStory"></dd></div>
          <div id="photoRow"><dt>Foto</dt><dd id="profilePhoto"></dd></div>
        </dl>
        <section class="register">
          <p class="register-question">¿Querés registrarte?</p>
          <form id="registerForm">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required />
            <label for="password">Contraseña</label>
            <input id="password" type="password" minlength="6" autocomplete="new-password" required />
            <label for="passwordConfirmation">Repetir contraseña</label>
            <input id="passwordConfirmation" type="password" minlength="6" autocomplete="new-password" required />
            <button type="submit">REGISTRARME</button>
            <p id="registerStatus" class="register-status" role="status"></p>
          </form>
        </section>
      </section>
      <p id="empty" class="empty">No encontramos una historia cargada.</p>
    </main>
    <section id="registrationNotice" class="registration-notice" role="dialog" aria-modal="true" aria-labelledby="noticeTitle" hidden>
      <div>
        <p class="eyebrow">un paso más</p>
        <h2 id="noticeTitle">Revisá<br /><span>tu email.</span></h2>
        <p>Verificá tu email para activar tu cuenta.</p>
        <a class="notice-login" href="../ingresar/">¿Ya estabas registrado? Iniciá sesión</a>
        <button id="closeNotice" type="button">ENTENDIDO</button>
      </div>
    </section>
    <script src="app.js?v=10"></script>
  </body>
</html>
